components:
  splitter:
    type: haystack.components.preprocessors.document_splitter.DocumentSplitter
    init_parameters:
      split_by: word
      split_length: ${CHUNK_SPLIT_LENGTH}
      split_overlap: ${CHUNK_SPLIT_OVERLAP}
  dense_embedder:
    type: src.ingest.components.ollama_embedder.OllamaDocumentEmbedder
    init_parameters:
      model: qwen3-embedding:0.6b
  sparse_embedder:
    type: src.ingest.components.sparse_embedder.BGE_M3SparseEmbedder
    init_parameters: {}
  perm_enricher:
    type: src.ingest.components.perm_enricher.PermissionMetadataEnricher
    init_parameters: {}
  writer:
    type: src.ingest.components.milvus_writer.MilvusDocumentStoreWriter
    init_parameters:
      collection_name: rag_documents
      milvus_host: ${MILVUS_HOST}
      milvus_port: ${MILVUS_PORT}
connections:
- sender: splitter.documents
  receiver: dense_embedder.documents
- sender: dense_embedder.documents
  receiver: sparse_embedder.documents
- sender: sparse_embedder.documents
  receiver: perm_enricher.documents
- sender: perm_enricher.documents
  receiver: writer.documents
