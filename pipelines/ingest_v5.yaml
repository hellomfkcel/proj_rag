components:
  splitter:
    type: src.ingest.components.hierarchical_splitter.HierarchicalDocumentSplitter
    init_parameters:
      parent_split_length: ${CHUNK_PARENT_LENGTH}
      parent_split_overlap: 128
      child_split_length: ${CHUNK_CHILD_LENGTH}
      child_split_overlap: 32
  embedder:
    type: src.ingest.components.bge_m3_embedder.BGE_M3DocumentEmbedder
    init_parameters:
      # 客户端合批大小：512。
      # 曾降为 64 以缩短单批锁持有，但实测代价更大：
      # ①调用数 11→89，Tempo 碎片 trace 从 11 暴增到 89（可观测性退化）；
      # ②HTTP 往返开销 8 倍，ingest 更慢。Infinity 健康时 512 段真实文本
      #   仅 ~2.4s（dense 走 Infinity + 本地 sparse），锁持有很短。
      batch_size: 512
  perm_enricher:
    type: src.ingest.components.perm_enricher.PermissionMetadataEnricher
    init_parameters: {}
  writer:
    type: src.ingest.components.milvus_writer.MilvusDocumentStoreWriter
    init_parameters:
      collection_name: rag_documents
      milvus_host: ${MILVUS_HOST}
      milvus_port: ${MILVUS_PORT}
connections:
- sender: splitter.documents
  receiver: embedder.documents
- sender: embedder.documents
  receiver: perm_enricher.documents
- sender: perm_enricher.documents
  receiver: writer.documents
