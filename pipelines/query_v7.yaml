components:
  sparse_retriever:
    type: src.retrieve.components.sparse_retriever.MilvusSparseRetriever
    init_parameters:
      collection_name: rag_documents
      top_k: 30
      milvus_host: ${MILVUS_HOST}
      milvus_port: ${MILVUS_PORT}
  ranker:
    type: src.retrieve.components.reranker.BGEReranker
    init_parameters:
      top_k: 10
  hierarchical_merger:
    type: src.retrieve.components.hierarchical_merger.HierarchicalMerger
    init_parameters:
      window_size: 3
      max_total_chunks: 10
      milvus_host: ${MILVUS_HOST}
      milvus_port: ${MILVUS_PORT}
connections:
- sender: sparse_retriever.documents
  receiver: ranker.documents
- sender: ranker.documents
  receiver: hierarchical_merger.documents
