# RAG v14 — Nginx 反向代理配置
# 用途：统一入口，将 /api/* 代理到后端 FastAPI，其余请求到前端 Next.js
#
# 使用方式（Docker）：
#   docker run -p 80:80 -v ./nginx.conf:/etc/nginx/nginx.conf:ro nginx:alpine
#
# 使用方式（docker-compose）：
#   在 app.yml 中定义 nginx 服务，见 docker-compose.app.yml

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # 日志格式（JSON，方便接入 Grafana/Loki）
    log_format json_combined escape=json '{'
        '"time_local":"$time_local",'
        '"remote_addr":"$remote_addr",'
        # 用 $uri（不含 query string）防 JWT/敏感参数落日志（SSE 的 ?token= 等）
        '"uri":"$uri",'
        '"status":$status,'
        '"body_bytes_sent":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"http_referer":"$http_referer",'
        '"http_user_agent":"$http_user_agent"'
        '}';

    access_log /var/log/nginx/access.log json_combined;
    error_log  /var/log/nginx/error.log warn;

    sendfile        on;
    keepalive_timeout 65;

    # 上传文件大小限制（与后端对齐）
    client_max_body_size 50m;

    # ── 上游服务定义 ──────────────────────────────────────────
    # Docker 环境中使用服务名；宿主机部署改为 localhost

    upstream backend {
        server api:8000;        # Docker 服务名；宿主机改为 localhost:8000
    }

    upstream frontend {
        server frontend:3001;   # Docker 服务名；宿主机改为 localhost:3001
    }

    server {
        listen 80;
        server_name _;

        # ── 健康检查（透传到后端） ─────────────────────────────
        location /healthz {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ── API 请求 → 后端 FastAPI ────────────────────────────
        location /api/ {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # SSE 流式支持（对话流式输出需要）
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 300s;   # 长连接超时（LLM 生成可能需要较长时间）
            proxy_http_version 1.1;
            proxy_set_header Connection '';
        }

        # ── 其余请求 → 前端 Next.js ──────────────────────────
        location / {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket 支持（Next.js HMR 开发时需要）
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
